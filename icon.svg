<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17" />
      <stop offset="100%" stop-color="#131722" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- 4 Minimalist Quadrants -->
  <!-- Top Left: Spor (Emerald) -->
  <rect x="120" y="120" width="116" height="116" rx="28" fill="url(#emeraldGrad)" />
  <!-- Top Right: Ders (Cyan) -->
  <rect x="276" y="120" width="116" height="116" rx="28" fill="url(#cyanGrad)" />
  <!-- Bottom Left: Yaratıcılık (Amber) -->
  <rect x="120" y="276" width="116" height="116" rx="28" fill="url(#amberGrad)" />
  <!-- Bottom Right: Core Momentum (Midnight Blue) -->
  <rect x="276" y="276" width="116" height="116" rx="28" fill="url(#primaryGrad)" />
</svg>
